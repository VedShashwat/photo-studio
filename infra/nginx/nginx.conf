events {}

http {
  upstream frontend { server frontend:3000; }
  upstream api { server api:8000; }

  server {
    listen 80;
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }
  }
}
