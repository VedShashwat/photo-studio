name: photo-studio

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/studio
      STORAGE_ROOT: /app/storage
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/studio
      STORAGE_ROOT: /app/storage
      MODEL_CACHE_DIR: /models
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./storage:/app/storage
      - ./model_cache:/models
    profiles: [gpu]

  frontend:
    build: { context: ./frontend }
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [api]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on: [api, frontend]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    profiles: [proxy]

volumes:
  postgres_data:
  studio_storage:
  model_cache:
