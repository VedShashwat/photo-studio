[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-photo-studio-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "Pillow>=11,<12",
  "accelerate==1.10.1",
  "diffusers==0.35.2",
  "huggingface-hub==0.35.3",
  "kornia==0.8.2",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pydantic-settings>=2.6,<3",
  "safetensors==0.6.2",
  "sqlalchemy>=2.0,<3",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.0",
  "timm==1.0.20",
  "scipy==1.15.3",
  "scikit-image==0.25.2",
  "einops==0.8.1",
]
